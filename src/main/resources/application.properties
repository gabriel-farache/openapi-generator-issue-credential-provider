quarkus.openapi-generator.codegen.spec.openapi_yml.model-name-prefix=QuarkusOpenApiGenerator

quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret

# Tell Dev Services for Keycloak to import the realm file
# This property is ineffective when running the application in JVM or Native modes but only in dev and test modes.

quarkus.keycloak.devservices.realm-path=quarkus-realm.json

quarkus.oidc-client.BearerToken.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.BearerToken.token-path=${quarkus.oidc.auth-server-url}/protocol/openid-connect/token
quarkus.oidc-client.BearerToken.discovery-enabled=false
quarkus.oidc-client.BearerToken.client-id=${quarkus.oidc.client-id}
quarkus.oidc-client.BearerToken.grant.type=password
quarkus.oidc-client.BearerToken.grant-options.password.username=alice
quarkus.oidc-client.BearerToken.grant-options.password.password=alice
quarkus.oidc-client.BearerToken.credentials.client-secret.value=${quarkus.oidc.credentials.secret}


quarkus.oidc-client.BearerTokenOther.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.BearerTokenOther.token-path=${quarkus.oidc.auth-server-url}/protocol/openid-connect/token
quarkus.oidc-client.BearerTokenOther.discovery-enabled=false
quarkus.oidc-client.BearerTokenOther.client-id=${quarkus.oidc.client-id}
quarkus.oidc-client.BearerTokenOther.grant.type=password
quarkus.oidc-client.BearerTokenOther.grant-options.password.username=alice
quarkus.oidc-client.BearerTokenOther.grant-options.password.password=alice
quarkus.oidc-client.BearerTokenOther.credentials.client-secret.value=${quarkus.oidc.credentials.secret}

quarkus.openapi-generator.simple_server_yaml.auth.BearerToken.header-name=X-Authorization-First
quarkus.openapi-generator.simple_server_yaml.auth.BearerTokenOther.header-name=X-Authorization-Other
quarkus.openapi-generator.simple_server_yaml.auth.SimpleBearerToken.header-name=X-Authorization-Simple
quarkus.openapi-generator.simple_server_yaml.auth.SimpleBearerToken.bearer-token=TEST
quarkus.rest-client.simple_server_yaml.url=http://localhost:8181
quarkus.http.port=9000
